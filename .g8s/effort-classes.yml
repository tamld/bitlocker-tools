# Effort Classes Configuration — Security Profile (issue #550 / C2)
# Maps task write-scope paths to reasoning effort defaults.
# Schema: schema_version "effort-classes.v1", first match by priority wins.
# Unregistered tasks implicitly default to medium (fail-open floor).

schema_version: "effort-classes.v1"

classes:
  - name: security-review
    default_effort: high
    priority: 10
    paths:
      - "src/guards/**"
      - "src/core/**"
      - "SECURITY.md"

  - name: test
    default_effort: medium
    priority: 20
    paths:
      - "tests/**"
      - "*_test.*"
      - "**/*_test.*"

  - name: docs
    default_effort: low
    priority: 30
    paths:
      - "*.md"
      - "docs/**"
      - "wiki/**"
      - "templates/**"
      - "examples/**"
